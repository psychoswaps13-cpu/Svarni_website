<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>स्वर्णी | SWARNI Jewellery</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Mukta:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;--bg:#ffffff;--card:#ffffff;--ink:#2b1a10;--mute:#7a6555;--brown:#3a1f12;--brown2:#5a3320;--gold:#b8893a;--gold2:#d9b46a;--line:#e6d9c3;--ok:#2e7d4f;--err:#b3261e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Mukta,system-ui,sans-serif}
h1,h2,h3{font-family:"Cormorant Garamond",Georgia,serif;font-weight:600;line-height:1.15;margin:0}
a{color:inherit;text-decoration:none}button{font:inherit;cursor:pointer}img{max-width:100%;display:block}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.wrap{max-width:1240px;margin:0 auto;padding:0 16px}
.bar{background:var(--brown);color:#f3dfb4;text-align:center;font-size:13px;padding:6px 10px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--card);border-bottom:1px solid var(--line)}
.hrow{display:flex;align-items:center;gap:14px;padding:10px 0}
.logo{display:flex;align-items:center;gap:8px;font:600 26px "Cormorant Garamond",serif}
.logo img{width:46px;height:46px;border-radius:50%}
.search{flex:1;display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--bg)}
.search input{flex:1;border:0;background:none;padding:9px 12px;color:var(--ink);font:inherit;min-width:0}
.search button{border:0;background:var(--brown2);color:#fff;padding:0 14px}
.ico{position:relative;background:none;border:0;color:var(--ink);padding:6px;font-size:14px;display:flex;flex-direction:column;align-items:center}
.ico b{position:absolute;top:-2px;right:-2px;background:var(--gold);color:#fff;border-radius:9px;font-size:11px;min-width:18px;text-align:center;padding:0 4px}
nav{display:flex;gap:22px;overflow-x:auto;padding:0 0 10px;font-size:15px;white-space:nowrap}
nav a{padding:2px 0;border-bottom:2px solid transparent}nav a:hover,nav a.on{border-color:var(--gold)}
.btn{background:var(--brown2);color:#fff;border:0;border-radius:6px;padding:10px 18px;font-weight:500;transition:background .2s}
.btn:hover{background:var(--brown)}.btn.gold{background:var(--gold)}.btn.gold:hover{background:#9c722b}
.btn.line{background:none;color:var(--ink);border:1px solid var(--gold)}.btn.sm{padding:6px 12px;font-size:14px}.btn[disabled]{opacity:.5;cursor:not-allowed}
.hero{position:relative;min-height:440px;border-radius:10px;overflow:hidden;margin-top:16px;display:flex;align-items:center;background:#3a1f12}
.hero .art{position:absolute;inset:0;background-size:cover;background-position:right center;opacity:.95}
.hero .txt{position:relative;color:#fbeed1;padding:32px;max-width:520px}
.hero h1{font-size:clamp(38px,6vw,64px);font-style:italic;margin-bottom:12px}
.hero p{margin:0 0 20px;color:#ead7b2}
.hero .txt{background:linear-gradient(90deg,rgba(40,20,10,.85),transparent);}
section{margin:44px 0}section>h2{font-size:30px;margin-bottom:16px;display:flex;justify-content:space-between;align-items:baseline}
section>h2 a{font:500 14px Mukta;color:var(--gold)}
.trust{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-top:20px}
.trust div{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px 14px;font-size:14px}.trust b{display:block}.trust .tb{display:flex;align-items:center;gap:12px}.trust .tb i{flex:none;width:44px;height:44px;border-radius:50%;background:#f6ebd5;color:var(--gold);display:flex;align-items:center;justify-content:center}.trust .tb svg{width:22px;height:22px}
.cats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:14px;text-align:center}
.cats img{width:100%;max-width:130px;aspect-ratio:1;border-radius:50%;margin:0 auto 6px;border:2px solid var(--gold2);object-fit:cover}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px}
.pc{background:var(--card);border:1px solid var(--line);border-radius:8px;overflow:hidden;position:relative;display:flex;flex-direction:column}
.pc img{aspect-ratio:1;width:100%;object-fit:cover}.pc .b{padding:10px 12px;flex:1;display:flex;flex-direction:column;gap:3px}
.pc h3{font:500 16px Mukta}.pc .heart{position:absolute;top:8px;right:8px;background:rgba(255,253,249,.9);border:0;border-radius:50%;width:34px;height:34px;font-size:18px;color:var(--brown2)}
.heart.on{color:#c0392b}.price{font-weight:600}.mrp{text-decoration:line-through;color:var(--mute);font-weight:400;font-size:14px;margin-left:6px}.off{color:var(--ok);font-size:13px;margin-left:6px}
.star{color:var(--gold);font-size:14px}.pc .btn{margin:0 12px 12px}
.bridal{border-radius:10px;min-height:260px;display:flex;align-items:center;padding:32px;color:#fbeed1;background:linear-gradient(90deg,#3a1f12,#6b3a22)}
.bridal h2{font-size:40px}
.rev{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px}.rev div{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:14px}
footer{background:var(--brown);color:#e6cfa3;margin-top:60px;padding:36px 0 20px;font-size:14px}
footer .cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:24px}footer h4{color:#fff;margin:0 0 8px}footer a{display:block;margin:3px 0}
.shop{display:grid;grid-template-columns:230px 1fr;gap:22px;margin-top:20px}
.filters{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:14px;align-self:start}
.filters h4{margin:12px 0 4px}.filters label{display:block;font-size:14px}
select,input,textarea{font:inherit;color:var(--ink)}select,.f input,.f textarea,.f select{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:8px 10px;width:100%}
.crumbs{font-size:13px;color:var(--mute);margin-top:14px}
.pd{display:grid;grid-template-columns:1fr 1fr;gap:28px;margin-top:20px}
.zoom{overflow:hidden;border-radius:10px;border:1px solid var(--line);cursor:zoom-in}.zoom img{width:100%;aspect-ratio:1;object-fit:cover;transition:transform .15s}
.zoom:hover img{transform:scale(2)}.thumbs{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}.thumbs img{width:64px;height:64px;border-radius:6px;border:2px solid var(--line);cursor:pointer;object-fit:cover}.thumbs img.on{border-color:var(--gold)}
.spec{width:100%;border-collapse:collapse;font-size:14px}.spec td{padding:6px 0;border-bottom:1px solid var(--line)}.spec td:first-child{color:var(--mute);width:40%}
.qty{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}.qty button{background:var(--card);border:0;width:34px;color:var(--ink)}.qty span{min-width:36px;text-align:center;padding:6px 0}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.box{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:16px}
.two{display:grid;grid-template-columns:1fr 340px;gap:20px;margin-top:20px}
.ci{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}.ci img{width:84px;height:84px;border-radius:6px;object-fit:cover}
.f{display:grid;gap:10px}.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--brown);color:#fff;padding:10px 18px;border-radius:8px;z-index:50;box-shadow:0 6px 20px rgba(0,0,0,.3)}
.toast.err{background:var(--err)}
.wa{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));background:#25d366;color:#fff;border-radius:30px;padding:10px 16px;font-weight:600;z-index:15;box-shadow:0 4px 14px rgba(0,0,0,.25)}
table.t{width:100%;border-collapse:collapse;font-size:14px}.t th,.t td{padding:8px;border-bottom:1px solid var(--line);text-align:left}.t input{width:80px;padding:4px 6px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}.tabs button{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 14px;border-radius:20px}.tabs button.on{background:var(--brown2);color:#fff}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}.stats .box b{font:600 28px "Cormorant Garamond",serif;display:block}
.steps{display:flex;gap:6px;margin:10px 0}.steps i{flex:1;height:6px;border-radius:3px;background:var(--line)}.steps i.on{background:var(--gold)}
.sk{background:linear-gradient(90deg,var(--line),var(--card),var(--line));background-size:200%;animation:sh 1.2s infinite;border-radius:8px;aspect-ratio:1}@keyframes sh{to{background-position:-200%}}
.scroll{overflow-x:auto}
.mbtn{display:none}
@media(max-width:820px){.shop,.pd,.two{grid-template-columns:1fr}.mbtn{display:inline-block}.filters.hide{display:none}.hrow{flex-wrap:wrap}.search{order:5;flex-basis:100%}.logo span{font-size:22px}.f2{grid-template-columns:1fr}}
@media(max-width:560px){.grid{grid-template-columns:repeat(2,1fr);gap:10px}.pc h3{font-size:14px}.pc .b{padding:8px}.pc .btn{margin:0 8px 8px;padding:8px}.price{font-size:15px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.hero{min-height:0;display:block;background:#f4ead8}.hero .bn{width:100%;display:block}.bshop{position:absolute;left:5%;bottom:8%}@media(max-width:820px){.bshop{padding:6px 12px;font-size:13px;left:4%;bottom:6%}}
.avatar{flex:none;width:40px;height:40px;border-radius:50%;background:var(--brown2);color:#fff;display:flex;align-items:center;justify-content:center;font:600 18px Mukta,sans-serif;position:relative;border:2px solid var(--gold)}.avatar img{width:100%;height:100%;object-fit:cover;border-radius:50%}.avatar .dot{position:absolute;top:-6px;right:-6px;background:#c0392b;color:#fff;border-radius:9px;min-width:18px;font:600 11px/18px Mukta,sans-serif;text-align:center;padding:0 4px}.avatar.big{width:84px;height:84px;font-size:34px}
.menurow{display:flex;justify-content:space-between;align-items:center;padding:14px 12px;border:1px solid var(--line);border-radius:8px;background:var(--card)}.menurow:after{content:"›";color:var(--gold);font-size:22px}
